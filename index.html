<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Script Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Script Hub</h1>
    <p>Simple script library</p>
  </header>
  <main>
    <div class="toolbar">
      <input
        id="search"
        type="text"
        placeholder="Search scripts..."
      >
      <select id="gameFilter">
        <option value="all">All games</option>
      </select>
    </div>
    <p id="status">Loading...</p>
    <div id="scriptGrid"></div>
    <p id="empty" class="hidden">
      No scripts found.
    </p>
  </main>
  <!-- Script viewer -->
  <div id="modal" class="hidden">
    <div id="modalBackdrop"></div>
    <div class="modal-box">
      <button id="closeModal">
        Close
      </button>
      <h2 id="modalTitle"></h2>
      <p id="modalGame"></p>
      <p id="modalDescription"></p>
      <pre id="modalCode"></pre>
      <button id="copyModal">
        Copy Script
      </button>
    </div>
  </div>
  <footer>
    <p>
      Script Hub © <span id="year"></span>
    </p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
